services:
  jerryscanai-backend:
    build: .
    image: ${JERRYSCAN_IMAGE:-ghcr.io/roys10/jerryscanai:latest}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./runtime-data:/app/runtime-data
    environment:
      JERRYSCAN_MODEL_FOLDER: /app/models/${JERRYSCAN_MODEL_NAME:-Patchcore_rembg_u2net_black_v1_256_c10_seed42}
      JERRYSCAN_HISTORY_PATH: /app/runtime-data/inspections_history.json
      JERRYSCAN_CONFIG_PATH: /app/runtime-data/settings.json
      JERRYSCAN_CORS_ORIGINS: ${JERRYSCAN_CORS_ORIGINS:-http://localhost:5173}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
