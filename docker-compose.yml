services:
  jerryscanai-backend:
    build: .
    image: ${JERRYSCAN_IMAGE:-ghcr.io/roys10/jerryscanai:latest}
    ports:
      - "0.0.0.0:80:8000"
    volumes:
      - ./models:/app/models:ro
      - ./runtime-data:/app/runtime-data
      - ./backend/.env:/app/backend/.env:ro
    env_file:
      - ./backend/.env
    environment:
      JERRYSCAN_HISTORY_PATH: /app/runtime-data/inspections_history.db
      JERRYSCAN_CONFIG_PATH: /app/runtime-data/settings.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
