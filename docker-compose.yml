services:
  jerryscanai-backend:
    build: .
    image: ${JERRYSCAN_IMAGE:-ghcr.io/roys10/jerryscanai:latest}
    ports:
      - "0.0.0.0:80:8000"
    volumes:
      - ./models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/G01.ckpt:/app/models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/G01.ckpt:ro
      - ./models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/G02.ckpt:/app/models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/G02.ckpt:ro
      - ./models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/G03.ckpt:/app/models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/G03.ckpt:ro
      - ./models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/G04.ckpt:/app/models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/G04.ckpt:ro
      - ./models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/u2net.onnx:/app/models/Patchcore_rembg_u2net_black_v1_256_c10_seed42/u2net.onnx:ro
      - ./runtime-data:/app/runtime-data
      - ./backend/.env:/app/backend/.env:ro
    env_file:
      - ./backend/.env
    environment:
      JERRYSCAN_HISTORY_PATH: /app/runtime-data/inspections_history.db
      JERRYSCAN_CONFIG_PATH: /app/runtime-data/settings.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 4
