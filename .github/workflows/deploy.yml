name: Build and Deploy Backend

on:
  push:
    branches:
      - backend-CD
      - Deploy-Jerryscan

# Ensure we have permissions to push to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/roys10/jerryscanai:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Remote Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          password: ${{ secrets.HOST_PASSWORD }}
          script: |
            mkdir -p ~/jerryscanai/models
            mkdir -p ~/jerryscanai/runtime-data
            mkdir -p ~/jerryscanai/backend

      - name: Copy docker-compose.yml to Remote Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          password: ${{ secrets.HOST_PASSWORD }}
          source: "docker-compose.yml"
          target: "~/jerryscanai"

      - name: Create backend/.env on Remote Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          password: ${{ secrets.HOST_PASSWORD }}
          script: |
            mkdir -p ~/jerryscanai/backend
            cat > ~/jerryscanai/backend/.env << 'EOF'
            JERRYSCAN_MODEL_FOLDER=/app/models/Patchcore_rembg_u2net_black_v1_256_c10_seed42
            JERRYSCAN_GPU_MODEL_COUNT=0
            JERRYSCAN_CPU_INFERENCE_CONCURRENCY=1
            JERRYSCAN_GPU_INFERENCE_CONCURRENCY=1
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            EOF
            chmod 600 ~/jerryscanai/backend/.env

      - name: Deploy to Remote Linux Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          password: ${{ secrets.HOST_PASSWORD }}
          script: |
            set -eu
            cd ~/jerryscanai

            # Create one script so all Docker commands run under sudo.
            cat << 'EOF' > deploy.sh
            #!/bin/bash
            set -euo pipefail

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --wait --wait-timeout 180
            docker image prune -a -f
            EOF

            chmod +x deploy.sh
            trap 'rm -f deploy.sh' EXIT
            echo "${{ secrets.HOST_PASSWORD }}" | sudo -S ./deploy.sh
